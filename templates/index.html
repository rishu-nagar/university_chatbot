<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aurora University AI Chatbot — Get instant answers to your university questions about admissions, academics, campus life, and more.">
    <title>Aurora — University AI Assistant</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Aurora background animation layer -->
    <div class="aurora-bg" aria-hidden="true">
        <div class="aurora-layer aurora-layer-1"></div>
        <div class="aurora-layer aurora-layer-2"></div>
        <div class="aurora-layer aurora-layer-3"></div>
        <div class="aurora-layer aurora-layer-4"></div>
        <div class="stars" aria-hidden="true"></div>
    </div>

    <!-- Application shell -->
    <div class="app-shell" id="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-group">
                    <div class="logo-icon" aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                            <circle cx="14" cy="14" r="12" stroke="url(#logo-grad)" stroke-width="2"/>
                            <path d="M14 4C14 4 8 10 8 16C8 19.3 10.7 22 14 22C17.3 22 20 19.3 20 16C20 10 14 4 14 4Z" fill="url(#logo-grad)" opacity="0.6"/>
                            <path d="M14 8C14 8 10 13 10 17C10 18.7 11.3 20 13 20H15C16.7 20 18 18.7 18 17C18 13 14 8 14 8Z" fill="url(#logo-grad-2)" opacity="0.8"/>
                            <defs>
                                <linearGradient id="logo-grad" x1="4" y1="4" x2="24" y2="24">
                                    <stop stop-color="#34d399"/>
                                    <stop offset="1" stop-color="#06b6d4"/>
                                </linearGradient>
                                <linearGradient id="logo-grad-2" x1="10" y1="8" x2="18" y2="20">
                                    <stop stop-color="#a78bfa"/>
                                    <stop offset="1" stop-color="#06b6d4"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="logo-text">
                        <h1 class="logo-title">Aurora</h1>
                        <span class="logo-subtitle">University AI</span>
                    </div>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect y="3" width="20" height="2" rx="1" fill="currentColor"/>
                        <rect y="9" width="14" height="2" rx="1" fill="currentColor"/>
                        <rect y="15" width="20" height="2" rx="1" fill="currentColor"/>
                    </svg>
                </button>
            </div>

            <button class="new-chat-btn" id="new-chat-btn">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path d="M9 3V15M3 9H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>New Chat</span>
            </button>

            <div class="sidebar-section">
                <h2 class="sidebar-section-title">Browse Topics</h2>
                <nav class="category-list" id="category-list" aria-label="FAQ categories">
                    <!-- Populated by JS -->
                </nav>
            </div>

            <div class="sidebar-section">
                <h2 class="sidebar-section-title">Chat History</h2>
                <div class="history-list" id="history-list">
                    <div class="history-empty">
                        <span>No conversations yet</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="ai-status" id="ai-status">
                    <span class="status-dot" id="status-dot"></span>
                    <span class="status-text" id="status-text">Checking status…</span>
                </div>
            </div>
        </aside>

        <!-- Mobile sidebar overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Main content area -->
        <main class="main-content" id="main-content">
            <!-- Mobile header bar -->
            <header class="mobile-header" id="mobile-header">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                        <rect y="4" width="22" height="2" rx="1" fill="currentColor"/>
                        <rect y="10" width="16" height="2" rx="1" fill="currentColor"/>
                        <rect y="16" width="22" height="2" rx="1" fill="currentColor"/>
                    </svg>
                </button>
                <span class="mobile-title">Aurora</span>
                <button class="mobile-new-chat" id="mobile-new-chat" aria-label="New chat">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </header>

            <!-- Chat messages area -->
            <div class="chat-container" id="chat-container">
                <!-- Welcome screen (shown when no messages) -->
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-aurora-icon" aria-hidden="true">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                            <circle cx="32" cy="32" r="28" stroke="url(#welcome-grad)" stroke-width="2.5" opacity="0.6"/>
                            <circle cx="32" cy="32" r="20" stroke="url(#welcome-grad-2)" stroke-width="2" opacity="0.4"/>
                            <path d="M32 10C32 10 18 24 18 38C18 45.2 24.3 50 32 50C39.7 50 46 45.2 46 38C46 24 32 10 32 10Z" fill="url(#welcome-grad)" opacity="0.3"/>
                            <path d="M32 18C32 18 22 28 22 38C22 42.4 26.5 46 32 46C37.5 46 42 42.4 42 38C42 28 32 18 32 18Z" fill="url(#welcome-grad-2)" opacity="0.4"/>
                            <path d="M32 26C32 26 26 32 26 38C26 40.2 28.7 42 32 42C35.3 42 38 40.2 38 38C38 32 32 26 32 26Z" fill="url(#welcome-grad-3)" opacity="0.6"/>
                            <defs>
                                <linearGradient id="welcome-grad" x1="4" y1="4" x2="60" y2="60">
                                    <stop stop-color="#34d399"/>
                                    <stop offset="1" stop-color="#06b6d4"/>
                                </linearGradient>
                                <linearGradient id="welcome-grad-2" x1="18" y1="10" x2="46" y2="50">
                                    <stop stop-color="#a78bfa"/>
                                    <stop offset="1" stop-color="#06b6d4"/>
                                </linearGradient>
                                <linearGradient id="welcome-grad-3" x1="26" y1="26" x2="38" y2="42">
                                    <stop stop-color="#f0abfc"/>
                                    <stop offset="1" stop-color="#34d399"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h2 class="welcome-title">Hello, I'm <span class="text-gradient">Aurora</span></h2>
                    <p class="welcome-subtitle">Your AI-powered university assistant. Ask me anything about admissions, academics, campus life, and more.</p>

                    <div class="suggested-prompts" id="suggested-prompts">
                        <button class="prompt-card" data-prompt="What are the general admission requirements?">
                            <span class="prompt-icon">🎓</span>
                            <span class="prompt-text">Admission Requirements</span>
                            <span class="prompt-desc">Learn how to apply</span>
                        </button>
                        <button class="prompt-card" data-prompt="What undergraduate programs are offered?">
                            <span class="prompt-icon">📚</span>
                            <span class="prompt-text">Programs Offered</span>
                            <span class="prompt-desc">Explore academic options</span>
                        </button>
                        <button class="prompt-card" data-prompt="What types of financial aid are available?">
                            <span class="prompt-icon">💰</span>
                            <span class="prompt-text">Financial Aid</span>
                            <span class="prompt-desc">Scholarships & funding</span>
                        </button>
                        <button class="prompt-card" data-prompt="What housing options are available?">
                            <span class="prompt-icon">🏫</span>
                            <span class="prompt-text">Campus Housing</span>
                            <span class="prompt-desc">Living on campus</span>
                        </button>
                        <button class="prompt-card" data-prompt="How do I access campus Wi-Fi?">
                            <span class="prompt-icon">💻</span>
                            <span class="prompt-text">IT & Wi-Fi</span>
                            <span class="prompt-desc">Tech support basics</span>
                        </button>
                        <button class="prompt-card" data-prompt="What career services does the university offer?">
                            <span class="prompt-icon">🚀</span>
                            <span class="prompt-text">Career Services</span>
                            <span class="prompt-desc">Jobs & internships</span>
                        </button>
                    </div>
                </div>

                <!-- Chat messages list -->
                <div class="messages-list" id="messages-list" role="log" aria-live="polite" aria-label="Chat messages">
                    <!-- Messages populated by JS -->
                </div>

                <!-- Scroll-to-bottom button -->
                <button class="scroll-bottom-btn" id="scroll-bottom-btn" aria-label="Scroll to bottom" style="display:none;">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <path d="M9 3V15M4 10L9 15L14 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

            <!-- Message composer -->
            <div class="composer-wrapper" id="composer-wrapper">
                <form class="composer" id="composer-form" autocomplete="off">
                    <div class="composer-inner">
                        <textarea
                            class="composer-input"
                            id="message-input"
                            placeholder="Ask me anything about university life…"
                            rows="1"
                            maxlength="2000"
                            aria-label="Type your message"
                        ></textarea>
                        <button class="composer-send" id="send-btn" type="submit" aria-label="Send message" disabled>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 10L17 3L10 17L9 11L3 10Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                    <div class="composer-footer">
                        <span class="char-count" id="char-count">0 / 2000</span>
                        <span class="composer-hint">Press Enter to send, Shift+Enter for new line</span>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Toast notification container -->
    <div class="toast-container" id="toast-container" aria-live="assertive"></div>

    <!-- Chat script -->
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
